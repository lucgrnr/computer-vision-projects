# Conda environment for KU Leuven H02A5a Computer Vision - Group 27
#
# Covers both assignments. Generated from the local `cv` conda environment,
# with the former Assignment_2/requirements.txt folded in.
#
# NOTE ON ASSIGNMENT 2 PINS
# Assignment 2 was developed and validated on Kaggle / Azure ML against an
# older pin set than the one below. Those pins were:
#     numpy==1.26.4              pandas==2.2.3
#     scipy==1.13.1              matplotlib==3.9.2
#     seaborn==0.13.2            torch==2.4.1
#     torchvision==0.19.1        scikit-learn==1.5.2
#     albumentations==1.4.24     opencv-python-headless==4.10.0.84
#     iterative-stratification==0.1.9
#
# That file pinned albumentations<2.0 on purpose: 2.x pulls in NumPy 2.x and
# breaks the rest of the Kaggle stack. This environment carries albumentations
# 2.0.8, so if you recreate Assignment 2 from this file, re-check the
# augmentation pipeline against the 2.x API before trusting the results.
#
# Recreate with:  conda env create -f environment.yml
